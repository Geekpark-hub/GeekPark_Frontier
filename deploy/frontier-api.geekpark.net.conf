# 前沿社 API / 管理后台 — 独立站点，勿改其他 conf
# 反代到 gp-galaxy: 192.168.123.14:3100

server {
  listen 80;
  server_name frontier-api.geekpark.net;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name frontier-api.geekpark.net;

  include ssl.conf;

  client_max_body_size 12M;
  access_log /var/log/nginx/frontier-api.access.log;
  error_log  /var/log/nginx/frontier-api.error.log;

  location / {
    proxy_pass http://192.168.123.14:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
